<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APIKEYGAME</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--bg:#090b11;--card:#10131c;--in:#171a26;--bd:#1b3644;--cy:#4fd3f0;--mut:#7d8aa0;--fg:#eef3fa}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 420px at 30% -5%,#12313a,transparent 70%),var(--bg);color:var(--fg);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(28px,env(safe-area-inset-top)) 22px max(32px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:18px;margin-bottom:30px}
#logo{width:68px;height:68px;border-radius:50%;object-fit:cover;border:3px solid #2a7f92;box-shadow:0 0 0 3px #123844,0 0 22px #22d3ee55;background:#0b0d14;flex:none}
h1{margin:0;font-size:clamp(22px,7vw,34px);font-weight:800;background:linear-gradient(90deg,#7fe3ff,#b48cff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.sub{margin-top:6px;color:var(--mut);font-weight:600;font-size:clamp(13px,3.8vw,17px);letter-spacing:.04em;text-transform:uppercase}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:26px;padding:20px 18px 18px;margin-bottom:22px}
.card h2{margin:0 0 14px 6px;font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cy)}
.card h2::before{content:"";display:inline-block;border-left:6px solid var(--cy);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-right:10px}
#demo{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:18px;border:1.5px solid #252a3a;background:var(--in)}
.count{background:var(--in);border:1.5px solid #252a3a;border-radius:20px;padding:20px;text-align:center}
#left{font-size:clamp(34px,11vw,54px);font-weight:800;line-height:1;background:linear-gradient(90deg,#22d3ee,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
#of{margin-top:8px;color:var(--mut);font-size:15px}
.bar{height:6px;background:#232838;border-radius:4px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#c084fc);transition:width .6s}
#get{width:100%;margin-top:16px;padding:17px;border:0;border-radius:18px;font-family:inherit;font-size:18px;font-weight:800;color:#06131a;background:linear-gradient(90deg,#22d3ee,#c084fc);cursor:pointer}
#get:disabled{opacity:.45;cursor:not-allowed}
#get:focus-visible{outline:2px solid #fff;outline-offset:3px}
#linkbox{display:none;margin-top:16px;border:2px dashed #2c6577;border-radius:20px;padding:16px;text-align:center}
#link{color:#7fe3ff;font-weight:700;font-size:16px;word-break:break-all}
#msg{margin-top:12px;color:var(--mut);font-size:15px;text-align:center;min-height:1em}
.led{position:fixed;inset:0;pointer-events:none;z-index:9;padding:3px;background:conic-gradient(from var(--ang),transparent 0 55%,#7c3aed 68%,#ff2bd6 82%,#ff7ae8 90%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 4s linear infinite;filter:drop-shadow(0 0 6px #d946ef)}
@keyframes spin{to{--ang:360deg}}
@media (prefers-reduced-motion:reduce){.led{animation:none}}
</style>
</head>
<body>
<div class="led"></div>
<div class="wrap">
  <header>
    <img id="logo" alt="" src="/logo.svg">
    <div><h1 id="name">APIKEYGAME</h1><div class="sub" id="sub"></div></div>
  </header>

  <section class="card">
    <h2>Demo</h2>
    <img id="demo" alt="Demo" src="/demo.svg">
  </section>

  <section class="card">
    <h2>Số key còn</h2>
    <div class="count">
      <div id="left">--</div>
      <div id="of"></div>
      <div class="bar"><i id="fill"></i></div>
    </div>
    <button id="get" type="button">Get key</button>
    <div id="linkbox"><a id="link" href="#"></a></div>
    <div id="msg"></div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);
function render(s){
  $("left").textContent=s.remaining;
  $("of").textContent="trên tổng "+s.total+" key";
  $("fill").style.width=(s.total?Math.round(s.remaining/s.total*100):0)+"%";
  if(s.link){
    $("linkbox").style.display="block";
    $("link").href=s.link;$("link").textContent=s.link;
    $("get").disabled=true;$("get").textContent="Đã nhận link";
  }else if(s.remaining<=0){
    $("get").disabled=true;$("get").textContent="Đã hết key";
  }
}
fetch("/api/config").then(r=>r.json()).then(c=>{
  $("name").textContent=c.name;$("sub").textContent=c.sub;$("logo").src=c.logo;$("demo").src=c.image;document.title=c.name;
}).catch(()=>{});
function load(){fetch("/api/status").then(r=>r.json()).then(render).catch(()=>{});}
load();setInterval(load,15000);
$("get").addEventListener("click",async()=>{
  $("get").disabled=true;$("msg").textContent="";
  try{
    const r=await fetch("/api/get",{method:"POST"});
    const d=await r.json();
    if(!r.ok){$("msg").textContent=d.error||"Lỗi, thử lại";load();return;}
    render(d);
  }catch(e){$("msg").textContent="Lỗi kết nối, thử lại";$("get").disabled=false;}
});
</script>
</body>
</html>
